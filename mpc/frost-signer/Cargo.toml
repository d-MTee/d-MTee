[package]
name = "dflow-frost-signer"
version = "1.0.0"
edition = "2021"

[dependencies]
frost-ed25519 = "3.0.0"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tonic = "0.12"

[build-dependencies]
tonic-build = "0.12"
