syntax = "proto3";

package mpc.v1;

service ParticipantSigner {
  rpc RegisterParticipant(RegisterParticipantRequest) returns (RegisterParticipantResponse);
  rpc CreateSigningSession(CreateSigningSessionRequest) returns (CreateSigningSessionResponse);

  rpc DkgRound1(DkgRound1Request) returns (DkgRound1Response);
  rpc DkgRound2(DkgRound2Request) returns (DkgRound2Response);
  rpc DkgFinalize(DkgFinalizeRequest) returns (DkgFinalizeResponse);

  rpc SignRound1(SignRound1Request) returns (SignRound1Response);
  rpc SignRound2(SignRound2Request) returns (SignRound2Response);

  rpc GetSessionStatus(GetSessionStatusRequest) returns (GetSessionStatusResponse);
  rpc FinalizeSession(FinalizeSessionRequest) returns (FinalizeSessionResponse);
}

// Peer traffic is served separately from coordinator control RPCs so each
// endpoint can apply a different certificate allow-list.
service ParticipantPeer {
  rpc DeliverDkgRound1(DeliverDkgRound1Request) returns (DeliverDkgRound1Response);
  rpc DeliverDkgRound2(DeliverDkgRound2Request) returns (DeliverDkgRound2Response);
  rpc PublishDkgTranscript(PublishDkgTranscriptRequest) returns (PublishDkgTranscriptResponse);
  rpc PublishDkgFinalization(PublishDkgFinalizationRequest) returns (PublishDkgFinalizationResponse);
}

message DeliverDkgRound1Request {
  string session_id = 1;
  string sender_id = 2;
  string recipient_id = 3;
  bytes package = 4;
}

message DeliverDkgRound1Response {
  bool accepted = 1;
  string package_hash = 2;
}

message DeliverDkgRound2Request {
  string session_id = 1;
  string sender_id = 2;
  string recipient_id = 3;
  string message_id = 4;
  bytes package = 5;
}

message DeliverDkgRound2Response {
  bool accepted = 1;
  string digest = 2;
}

message DkgTranscriptEntry {
  string participant_id = 1;
  string round1_package_hash = 2;
}

message PublishDkgTranscriptRequest {
  string session_id = 1;
  string sender_id = 2;
  uint32 threshold = 3;
  uint32 total_participants = 4;
  repeated DkgTranscriptEntry entries = 5;
  string transcript_hash = 6;
}

message PublishDkgTranscriptResponse {
  bool accepted = 1;
  string transcript_hash = 2;
  uint32 matching_participants = 3;
}

message PublishDkgFinalizationRequest {
  string session_id = 1;
  string sender_id = 2;
  string transcript_hash = 3;
  string public_key_package_hash = 4;
}

message PublishDkgFinalizationResponse {
  bool accepted = 1;
  uint32 matching_participants = 2;
}

message RegisterParticipantRequest {
  string participant_id = 1;
  string host = 2;
  string public_key = 3;
  string role = 4;
}

message RegisterParticipantResponse {
  bool ok = 1;
  string status = 2;
}

message CreateSigningSessionRequest {
  string session_id = 1;
  repeated string participant_ids = 2;
  uint32 threshold = 3;
  uint32 total_participants = 4;
  string message = 5;
  string encoding = 6;
}

message CreateSigningSessionResponse {
  bool ok = 1;
  string session_id = 2;
  string status = 3;
}

message DkgRound1Request {
  string session_id = 1;
  string participant_id = 2;
  string request_id = 3;
  uint32 threshold = 4;
  uint32 total_participants = 5;
}

message DkgRound1Response {
  bool ok = 1;
  string session_id = 2;
  string participant_id = 3;
  bytes round1_package = 4;
  string package_hash = 5;
}

message DkgRound2Request {
  string session_id = 1;
  string participant_id = 2;
}

message DkgRound2Response {
  bool ok = 1;
  string session_id = 2;
  string participant_id = 3;
  string status = 4;
  string transcript_hash = 5;
  uint32 delivered_packages = 6;
}

message DkgFinalizeRequest {
  string session_id = 1;
  string participant_id = 2;
}

message DkgFinalizeResponse {
  bool ok = 1;
  string session_id = 2;
  string participant_id = 3;
  bytes public_key_package = 4;
  string public_key_hash = 5;
  string status = 6;
}

message SignRound1Request {
  string session_id = 1;
  string participant_id = 2;
  bytes message = 3;
}

message SignRound1Response {
  bool ok = 1;
  string session_id = 2;
  string participant_id = 3;
  bytes commitment = 4;
}

message SignRound2Request {
  string session_id = 1;
  string participant_id = 2;
  bytes signing_package = 3;
}

message SignRound2Response {
  bool ok = 1;
  string session_id = 2;
  string participant_id = 3;
  bytes signature_share = 4;
}

message GetSessionStatusRequest {
  string session_id = 1;
}

message GetSessionStatusResponse {
  string session_id = 1;
  string phase = 2;
  bool ready = 3;
  repeated string completed_participants = 4;
  string error = 5;
}

message FinalizeSessionRequest {
  string session_id = 1;
  string request_id = 2;
  repeated bytes signature_shares = 3;
}

message FinalizeSessionResponse {
  bool ok = 1;
  string session_id = 2;
  string signature_hex = 3;
  bool verified = 4;
}
