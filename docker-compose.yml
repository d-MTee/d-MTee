services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 8080
      SOLANA_RPC_URL: https://api.devnet.solana.com
      DRY_RUN: "true"
    depends_on: [redis]
volumes:
  redis-data:
