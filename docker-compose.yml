services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 8080
      SOLANA_RPC_URL: https://api.devnet.solana.com
      DRY_RUN: "true"
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      NITRO_TRUSTED_ROOT_SHA256: ${NITRO_TRUSTED_ROOT_SHA256:-}
      NITRO_PCR3_P1: ${NITRO_PCR3_P1:-}
      NITRO_PCR3_P2: ${NITRO_PCR3_P2:-}
      NITRO_PCR3_P3: ${NITRO_PCR3_P3:-}
      NITRO_PCR3_COORDINATOR: ${NITRO_PCR3_COORDINATOR:-}
      NITRO_PCR4_P1: ${NITRO_PCR4_P1:-}
      NITRO_PCR4_P2: ${NITRO_PCR4_P2:-}
      NITRO_PCR4_P3: ${NITRO_PCR4_P3:-}
      NITRO_PCR4_COORDINATOR: ${NITRO_PCR4_COORDINATOR:-}
      NITRO_PCR8: ${NITRO_PCR8:-}
      NITRO_SIGNING_KEY_ID: ${NITRO_SIGNING_KEY_ID:-}
      NITRO_EXPECTED_PUBLIC_KEY_HEX: ${NITRO_EXPECTED_PUBLIC_KEY_HEX:-}
      POLICY_AUTHORITY_PUBLIC_KEY_HEX: ${POLICY_AUTHORITY_PUBLIC_KEY_HEX:-}
    depends_on: [redis]
volumes:
  redis-data:
